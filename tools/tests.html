<title>Cat Food Center Tests</title>
<meta charset="UTF-8">
<!-- Crawlable, not indexable. This page is a developer artifact: a wall of
     assertion output with no reader value, and a search result pointing at it
     under this site's name would be a worse answer than no result. robots.txt
     stays fully open on purpose (LICENSE.md section 4), and a Disallow there
     would be the wrong instrument anyway: it stops the fetch, not the listing,
     and a URL disallowed from crawling can still be indexed from a link alone.
     noindex is the one that actually says "do not list this", and it only
     works because the crawler is allowed to read the page and find it.
     Answers PRD open question 10. -->
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.svg">
<script src="../assets/cfc-theme.js"></script>
<link rel="stylesheet" href="../assets/cfc-tokens.css">
<style>
  body {
    margin: 0; padding: 32px 24px 64px;
    background: var(--bg); color: var(--ink);
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-family: Georgia, serif; font-size: 1.75rem; margin: 0 0 4px; }
  .lede { color: var(--ink-soft); margin: 0 0 28px; max-width: 62ch; }
  .lede code { font-size: .875em; }
  h2 {
    font-size: .8125rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-soft); margin: 28px 0 8px;
  }
  .summary {
    font-weight: 600; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--hairline); background: var(--surface); margin: 0 0 8px;
  }
  .summary.is-pass { color: var(--excellent); border-left: 3px solid var(--excellent); }
  .summary.is-fail { color: var(--bad); border-left: 3px solid var(--bad); }
  ul.assertions { list-style: none; margin: 0; padding: 0; }
  ul.assertions li {
    font-size: .875rem; padding: 5px 0 5px 26px; position: relative;
    border-bottom: 1px solid var(--hairline);
  }
  ul.assertions li:last-child { border-bottom: none; }
  ul.assertions li::before {
    position: absolute; left: 4px; top: 5px; font-weight: 700;
  }
  li.is-pass::before { content: "\2713"; color: var(--excellent); }
  li.is-fail::before { content: "\2717"; color: var(--bad); }
  li.is-fail { color: var(--bad); }
  pre {
    font-size: .8125rem; margin: 6px 0 2px; padding: 10px 12px; overflow-x: auto;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    color: var(--ink);
  }
  a { color: var(--accent); }
</style>

<main>
  <h1>Test suite</h1>
  <p class="lede">
    The project has no build step and no Node.js, so the tests run where the code
    runs. Serve the repository (<code>python -m http.server 8000</code>) and open
    this page: ES modules will not load over <code>file://</code>.
    <a href="../">Back to the site</a>.
  </p>
  <div id="results"></div>
</main>

<script type="module">
  import { run } from '../assets/js/test-runner.js';
  import '../assets/js/opff.test.js';
  import '../assets/js/scoring.test.js';
  import '../assets/js/scanner.test.js';
  import '../assets/js/catalogue.test.js';
  import '../assets/js/ingredients.test.js';
  import '../assets/js/barcodes.test.js';
  run();
</script>
